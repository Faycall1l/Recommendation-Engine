[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recagent"
version = "0.1.0"
description = "An agentic recommender: collaborative filtering candidates, refined by an LLM agent with tool use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faycall1l" }]
keywords = ["recommender-system", "collaborative-filtering", "agentic", "llm", "vllm", "als"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "implicit>=0.7.2",
    "numpy",
    "scipy",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
recagent = "recagent.cli:main"

[tool.setuptools.packages.find]
include = ["recagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
